# --- Metadata (top of form) ---
policy_version: "1.1-pumpfun-pumpswap-migration"
status: draft
created_by: human
linked_policy_id: null
notes: "Pump.fun → PumpSwap migration runner targeting early post-migration momentum. Designed to capture the first discovery move after bonding curve completion and AMM pool creation."

# --- Entry filters ---
max_pair_age_seconds: 1200
min_token_age_seconds: null
min_liquidity_usd: 12000
min_volume_1m_usd: 3500
min_volume_5m_usd: null
min_buy_sell_ratio: 1.2
min_transactions_1m: 20
min_velocity_score_1m: null
min_buy_pressure_1m: 0.55
min_buy_volume_1m_usd: 2000
min_sell_volume_1m_usd: null
max_top_holder_pct: null
min_holder_count: null

# --- Liquidity Trend Guard ---
liquidity_trend_guard_enabled: true
max_liquidity_drop_pct_30m: -0.20
max_liquidity_drop_pct_1h: -0.30
liquidity_trend_min_samples: 6

# --- Allowed DEXes ---
allowed_dexes: "pumpswap"

# --- Scoring weights ---
weight_liquidity_velocity: 0.10
weight_liquidity_absolute: 0.05
weight_volume_1m: 0.30
weight_volume_5m: 0.0
weight_volume_acceleration_1m: 0.35
weight_price_volatility_5m: 0.05
weight_market_cap: 0.0
weight_buy_sell_slope_1m: 0.25
weight_velocity_score_1m: 0.40
weight_buy_pressure_1m: 0.30
weight_sell_pressure_1m: -0.25
weight_buy_volume_1m: 0.20
weight_sell_volume_1m: -0.15
weight_price_momentum_5m: 0.20
weight_holder_growth: 0.0
weight_holder_concentration_penalty: 0.0
weight_time_since_launch: -0.20
weight_pair_age_seconds: -0.35

# --- Score Thresholds ---
min_trade_score: 65
priority_trade_score: 80

# --- Risk ---
risk_per_trade_pct: 3
stop_loss_pct: -28
take_profit_pct: 45
time_stop_seconds: 300

# --- Volume Collapse Exit ---
volume_collapse_exit_enabled: true
volume_collapse_ratio_threshold: 0.40
volume_collapse_consecutive_checks: 2
volume_collapse_min_samples: 6

# --- Rug Protection ---
rug_exit_enabled: true
rug_liquidity_floor_usd: 6000
rug_snapshot_stale_seconds: 90
rug_pair_missing_threshold: 3

# --- Limits ---
max_trades_per_hour: 3
max_concurrent_trades: 1
cooldown_seconds_after_loss: 900
cooldown_on_consecutive_losses: 3
cooldown_on_consecutive_losses_seconds: 1800

# --- Token Execution Controls ---
token_reentry_cooldown_seconds: 240
token_reentry_cooldown_seconds_after_win: 120
max_trades_per_token_per_hour: 2
pair_loss_cooldown_seconds: 3600
max_consecutive_losses_per_pair: 2

# --- Safety & Kill Switches ---
halt_on_liquidity_drop_pct: -40
require_no_mint_authority: false
require_no_freeze_authority: false
require_lp_lock: true
halt_on_rug_detected: true
allow_low_confidence_trades: false