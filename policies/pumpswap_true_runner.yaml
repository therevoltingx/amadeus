# --- Metadata (top of form) ---
policy_version: "1.1-pumpswap-true-runner"
status: draft
created_by: human
linked_policy_id: null
notes: "PumpSwap true-runner strategy targeting sustained high-volume tokens with strong buyer dominance and liquidity stability. Designed for multi-hour to multi-day holds."

# --- Entry filters ---
max_pair_age_seconds: 86400
min_token_age_seconds: 600
min_liquidity_usd: 25000
min_volume_1m_usd: 8000
min_volume_5m_usd: 25000
min_buy_sell_ratio: 1.3
min_transactions_1m: 35
min_velocity_score_1m: null
min_buy_pressure_1m: 0.58
min_buy_volume_1m_usd: 4000
min_sell_volume_1m_usd: null
max_top_holder_pct: null
min_holder_count: null

# --- Liquidity Trend Guard ---
liquidity_trend_guard_enabled: true
max_liquidity_drop_pct_30m: -0.15
max_liquidity_drop_pct_1h: -0.20
liquidity_trend_min_samples: 8

# --- Allowed DEXes ---
allowed_dexes: "pumpswap"

# --- Scoring weights ---
weight_liquidity_velocity: 0.20
weight_liquidity_absolute: 0.20
weight_volume_1m: 0.25
weight_volume_5m: 0.35
weight_volume_acceleration_1m: 0.25
weight_price_volatility_5m: 0.10
weight_market_cap: 0.05
weight_buy_sell_slope_1m: 0.30
weight_velocity_score_1m: 0.20
weight_buy_pressure_1m: 0.35
weight_sell_pressure_1m: -0.35
weight_buy_volume_1m: 0.25
weight_sell_volume_1m: -0.25
weight_price_momentum_5m: 0.45
weight_holder_growth: 0.0
weight_holder_concentration_penalty: 0.0
weight_time_since_launch: 0.10
weight_pair_age_seconds: 0.10

# --- Score Thresholds ---
min_trade_score: 74
priority_trade_score: 90

# --- Risk ---
risk_per_trade_pct: 4
stop_loss_pct: -35
take_profit_pct: 200
time_stop_seconds: null

# --- Volume Collapse Exit ---
volume_collapse_exit_enabled: true
volume_collapse_ratio_threshold: 0.30
volume_collapse_consecutive_checks: 3
volume_collapse_min_samples: 10

# --- Rug Protection ---
rug_exit_enabled: true
rug_liquidity_floor_usd: 12000
rug_snapshot_stale_seconds: 120
rug_pair_missing_threshold: 3

# --- Limits ---
max_trades_per_hour: 2
max_concurrent_trades: 1
cooldown_seconds_after_loss: 1800
cooldown_on_consecutive_losses: 2
cooldown_on_consecutive_losses_seconds: 7200

# --- Token Execution Controls ---
token_reentry_cooldown_seconds: 3600
token_reentry_cooldown_seconds_after_win: 1800
max_trades_per_token_per_hour: 1
pair_loss_cooldown_seconds: 14400
max_consecutive_losses_per_pair: 2

# --- Safety & Kill Switches ---
halt_on_liquidity_drop_pct: -35
require_no_mint_authority: false
require_no_freeze_authority: false
require_lp_lock: true
halt_on_rug_detected: true
allow_low_confidence_trades: false